// JUEGO: MetajavBots encima del motor. No depende de ninguna ventana concreta.
apply plugin: 'java-library'

sourceSets {
    main {
        // Los datos (modelos, piezas, ejercicios, textos) viven en res/, en la raíz: se leen del classpath.
        resources.srcDirs = ['../res']
    }
}

dependencies {
    api project(':motor')
}

// El código del rival de la computadora va también dentro del juego, para leerlo en el taller (Taller › Código del rival).
tasks.named('processResources') {
    from('src/main/java/metajavbots/rivales') {
        include 'Rival.java'
        into 'codigo_rival'
    }
}
